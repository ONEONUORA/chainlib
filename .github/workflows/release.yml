name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get version from tag
      id: get_version
      run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: ChainLib ${{ steps.get_version.outputs.version }}
        draft: false
        prerelease: false
        body: |
          ## ChainLib Release ${{ steps.get_version.outputs.version }}
          
          ### 🚀 What's New
          - Check the commit history for detailed changes
          
          ### 📦 Assets
          - `chainlib-backend-linux-x64` - Backend binary for Linux
          - `chainlib-contracts.wasm` - Smart contract WASM file
          - `chainlib-frontend.zip` - Frontend build artifacts
          
          ### 🔧 Deployment
          1. Deploy the smart contracts using the provided WASM file
          2. Configure and run the backend binary
          3. Deploy the frontend to your preferred hosting platform
          
          ### 📚 Documentation
          See the README.md for setup and deployment instructions.

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: create-release
    
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install musl tools
      if: matrix.target == 'x86_64-unknown-linux-musl'
      run: sudo apt-get update && sudo apt-get install -y musl-tools

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "./backend -> target"

    - name: Build backend
      run: |
        cd backend
        cargo build --release --target ${{ matrix.target }}

    - name: Prepare binary
      run: |
        cd backend
        cp target/${{ matrix.target }}/release/chainlib-backend chainlib-backend-${{ matrix.target }}
        strip chainlib-backend-${{ matrix.target }} || true

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./backend/chainlib-backend-${{ matrix.target }}
        asset_name: chainlib-backend-${{ matrix.target }}
        asset_content_type: application/octet-stream

  build-contracts:
    name: Build Smart Contracts
    runs-on: ubuntu-latest
    needs: create-release
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "./contracts/chainlib-contracts -> target"

    - name: Install Soroban CLI
      run: cargo install --locked soroban-cli --features opt

    - name: Build contracts
      run: |
        cd contracts/chainlib-contracts
        soroban contract build

    - name: Prepare contract artifacts
      run: |
        cd contracts/chainlib-contracts
        cp target/wasm32-unknown-unknown/release/chainlib.wasm chainlib-contracts.wasm

    - name: Upload Contract WASM
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./contracts/chainlib-contracts/chainlib-contracts.wasm
        asset_name: chainlib-contracts.wasm
        asset_content_type: application/wasm

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: create-release
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Build frontend
      run: |
        cd frontend
        npm run build

    - name: Create frontend archive
      run: |
        cd frontend
        tar -czf ../chainlib-frontend-${{ needs.create-release.outputs.version }}.tar.gz .next/ public/ package.json

    - name: Upload Frontend Archive
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./chainlib-frontend-${{ needs.create-release.outputs.version }}.tar.gz
        asset_name: chainlib-frontend-${{ needs.create-release.outputs.version }}.tar.gz
        asset_content_type: application/gzip

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: create-release
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: |
          chainlib/backend:latest
          chainlib/backend:${{ needs.create-release.outputs.version }}
        platforms: linux/amd64,linux/arm64

    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: |
          chainlib/frontend:latest
          chainlib/frontend:${{ needs.create-release.outputs.version }}
        platforms: linux/amd64,linux/arm64